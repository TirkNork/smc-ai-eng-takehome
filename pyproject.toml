[project]
name = "smc-ai-eng-takehome"
version = "0.1.0"
description = "Financial Q&A chatbot grounded in SQL + 10-K vector search"
requires-python = ">=3.12"
dependencies = [
    "pinecone>=5.0.0",
    "python-dotenv>=1.0.1",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.5.0",
    "openai>=1.50.0",
    "langgraph>=1.2.9",
    "langchain-openai>=1.4.1",
    "fastapi>=0.140.0",
    "uvicorn[standard]>=0.51.0",
]

# Frontend-only deps, kept out of the default set so the backend image does
# not ship Streamlit. Install with: uv sync --extra frontend
[project.optional-dependencies]
frontend = [
    "streamlit>=1.40",
    "httpx>=0.27",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
